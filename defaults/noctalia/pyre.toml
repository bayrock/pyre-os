# PyreOS defaults for Noctalia (ADR 0013). Package-owned: do not edit.
# ~/.config/noctalia/config.toml includes this file; its own keys win, and
# changes made in Noctalia's settings window win over both.

[shell]
# Noctalia is the session's polkit agent; no separate agent is installed.
polkit_agent = true
telemetry_enabled = false
# PyreOS presets the theme, so Noctalia's first-run wizard is not shown.
setup_wizard_enabled = false

# The PyreOS theme (ADR 0015): Ember, a custom palette that pyre links into
# ~/.config/noctalia/palettes/. "pyre theme set" or Noctalia's settings
# window switches it; both write ~/.local/state/noctalia/settings.toml.
[theme]
mode = "dark"
source = "custom"
custom_palette = "Ember"

# Noctalia recolors these apps from the palette. The user stubs already
# include the generated files, so Noctalia does not edit your configs.
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["niri", "foot", "gtk3", "gtk4", "btop"]

# After those, the terminal colors for "pyre theme refresh", which recolors
# the foot windows already open (foot only reads its theme file at start).
[theme.templates.user.pyre-live]
input_path = "/usr/share/pyre/defaults/noctalia/live-colors.tmpl"
output_path = "$XDG_STATE_HOME/pyre/theme/live-colors"
post_hook = "pyre theme refresh"
index = 100

# Ember's wallpaper until you pick your own; the fill is its night sky, so
# nothing flashes while it loads. pyre theme set switches it with the theme.
[wallpaper]
fill_color = "#130e0a"

[wallpaper.default]
path = "/usr/share/pyre/themes/ember/wallpapers/ember.jpg"

# The PyreOS plugins (ADR 0016), from a read-only directory pyre-desktop
# owns: the welcome panel ("pyre welcome").
[plugins]
enabled = ["pyre/welcome"]

[[plugins.source]]
name = "pyre"
kind = "path"
location = "/usr/share/pyre/noctalia/plugins"
enabled = true

# Lock after 10 minutes idle and turn the screens off a minute later.
# Noctalia locks before suspend by default.
[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true
