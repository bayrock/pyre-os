# Offline checks and package builds on every push and pull request.
# Runs in an Arch container so tool versions match the development host.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git shellcheck bats python jq diffutils
      - uses: actions/checkout@v5
      - name: tools/check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/check

  packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed base-devel git namcap
      - uses: actions/checkout@v5
      # Vendored packages (GraalVM builds) are reused from the newest cache while
      # their version is unchanged; tools/build-pkgs rebuilds PyreOS packages anyway.
      - uses: actions/cache@v4
        with:
          path: build/repo
          key: repo-${{ github.run_id }}
          restore-keys: repo-
      - name: tools/build-pkgs
        # makepkg refuses root, so build as an unprivileged user. --syncdeps installs
        # the vendored packages' makedepends into this throwaway container.
        env:
          PACKAGER: PyreOS CI <ci@pyreos.invalid>
        run: |
          useradd -m builder
          echo 'builder ALL=(root) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c 'tools/build-pkgs --syncdeps'
      - name: namcap
        run: namcap build/repo/*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: repo
          path: build/repo/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  # The testing channel (ADR 0009): pushes to main publish the unsigned build from
  # the packages job, signed here with the release subkey, to the "testing" release.
  # Only this job sees the secret.
  publish:
    needs: [check, packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    concurrency:
      group: publish-testing
      cancel-in-progress: false
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: repo
          path: build/repo
      - name: tools/publish-testing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYRE_SIGNING_SUBKEY: ${{ secrets.PYRE_SIGNING_SUBKEY }}
        run: |
          [ -n "$PYRE_SIGNING_SUBKEY" ] || { echo "the PYRE_SIGNING_SUBKEY secret is not set" >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$PYRE_SIGNING_SUBKEY" | gpg --batch --quiet --import
          unset PYRE_SIGNING_SUBKEY
          tools/publish-testing build/repo
