# pacman.conf for installing from the PyreOS live medium's offline repository.
# pyre-install copies it over the live system's /etc/pacman.conf (ADR 0006).
# The repository holds Arch's own sync databases, so Arch packages keep their
# signatures. The installed system gets the stock pacman.conf.

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = file://@OFFLINE_REPO@

[extra]
Server = file://@OFFLINE_REPO@

# PyreOS development packages are unsigned until P4 (ADR 0009).
[pyre]
SigLevel = Optional TrustAll
Server = file://@OFFLINE_REPO@
